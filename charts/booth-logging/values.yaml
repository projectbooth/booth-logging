# Default values for booth-logging.
#
# Three workloads, one release:
#   - the viewer API (Deployment)  — what booth-core's gateway routes /modules/logging/* to
#   - Loki (StatefulSet)           — stores and indexes the logs
#   - the collector (DaemonSet)    — Grafana Alloy on every node, tailing /var/log/pods
# Modules integrate with none of this: they write to stdout/stderr and are collected
# automatically (ADR 0022).

replicaCount: 1

image:
  repository: ghcr.io/projectbooth/booth-logging
  tag: "" # defaults to Chart.appVersion
  pullPolicy: IfNotPresent

service:
  port: 8080

oidc:
  # Required: the same OIDC issuer/client every module verifies against independently
  # (core-platform-api.md's defense-in-depth requirement).
  issuerUrl: ""
  clientId: ""
  requireAudience: true
  # Must match booth-core's BOOTH_OIDC_GROUPS_CLAIM: the caller's role is re-derived from
  # this claim, never taken from the forwarded X-Booth-Role alone (ADR 0041).
  groupsClaim: groups
  # Optional: booth-core's issuer URL, to also accept its workload tokens (ADR 0056).
  workloadIssuerUrl: ""

# Who may read which logs (ADR 0067 as amended by ADR 0077). Only workspace owners ever read
# logs; editors and viewers read nothing.
#
# workspaces lists the OPERATOR workspaces. An owner acting in one of them is an operator and
# reads everything: every module's and every pod's logs, platform-wide. Any other owner reads
# only the logs of pods labelled booth.projectbooth.io/workspace=<their active workspace>
# (their workspace's own pods, e.g. its notebook servers). That pin is applied server-side, and
# the label comes from pod metadata, never log content. Shared module pods (core, storage,
# catalog, ...) carry no workspace label and are invisible to them.
#
# workspaces: [] (the default) means no operators: every owner is scoped to their own workspace,
# nobody can read shared platform logs, and the Grafana view isn't deployed. Typically list one
# dedicated workspace, e.g. [platform]. See docs/decisions/0002 and 0008.
access:
  workspaces: []

# Optional cap on one query's time span, as a Go duration (e.g. "24h"). Empty means the
# full retention window.
queryMaxRange: ""

loki:
  image:
    repository: grafana/loki
    tag: "3.7.8"
    pullPolicy: IfNotPresent

  # How long logs are kept, in whole days. Loki's compactor deletes anything older, and
  # queries never reach further back than this.
  #
  # 14 days by default (ruling of 2026-09-22: short, 7-14 days, configurable). Why 14 and
  # not 7: these logs are for operational debugging, and the problems that need them are
  # often noticed late — something that started before a long weekend or a week off, or a
  # regression you want to compare against "the same time last week". Seven days loses
  # exactly that comparison. Loki compresses heavily, so the second week costs little disk
  # (see persistence.size). Changing it later is just this value; nothing else changes.
  # See docs/decisions/0001-retention-default.md.
  retentionDays: 14

  logLevel: info

  persistence:
    # Without persistence, all logs are lost whenever the Loki pod restarts.
    enabled: true
    # Sized for a small cluster at the default 14-day retention. Raise it for chattier
    # clusters (roughly: compressed daily volume x retentionDays, plus headroom).
    size: 20Gi
    storageClass: ""

  resources: {}

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001 # the loki image's own user
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

collector:
  image:
    # Grafana Alloy. ADR 0022 names Promtail or Grafana Agent, but both are end-of-life
    # (Agent: Nov 2025, Promtail: Mar 2026) and Alloy is their named successor.
    # See docs/decisions/0003-collector-grafana-alloy.md.
    repository: grafana/alloy
    tag: "v1.19.2"
    pullPolicy: IfNotPresent

  # Namespaces whose pods are NOT collected. Empty collects every pod on every node, which
  # is what ADR 0022 asks for.
  excludeNamespaces: []

  # Where Alloy keeps its read positions on each node, so a collector restart resumes where
  # it left off instead of re-shipping or skipping lines.
  hostDataPath: /var/lib/booth-logging-collector

  # Every node, control plane included, runs pods whose logs matter.
  tolerations:
    - operator: Exists

  resources: {}

  # Container log files under /var/log/pods are owned by root and not world-readable, so
  # the collector runs as uid 0 — but with no capabilities, no privilege escalation, a
  # read-only root filesystem, and the log directory mounted read-only.
  securityContext:
    runAsUser: 0
    runAsGroup: 0
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
    seccompProfile:
      type: RuntimeDefault

# The Grafana power-user view (ADR 0076): full Grafana with arbitrary LogQL over Loki, registered
# as a second module, `logging-grafana` (uiIntegrationMode: iframe-proxy), next to the native
# viewer.
#
# !! OPERATORS ONLY (ADR 0077). Grafana runs arbitrary LogQL over every tenant's logs, which
# !! can't be pinned to one workspace, so only owners acting in an access.workspaces workspace
# !! are admitted. Every other owner is refused outright, not admitted at a lower role. With
# !! access.workspaces empty there are no operators, so none of this is deployed at all:
# !! no Grafana, no nav entry.
#
# Authentication is Grafana's own JWT auth over the X-Booth-Identity assertion booth-core signs
# on every iframe-proxied request (ADR 0069), verified against core's keys: no Grafana login,
# no admin account, no anonymous access. An admitted operator gets admittedRole.
grafana:
  enabled: true

  image:
    repository: grafana/grafana
    tag: "13.2.2"
    pullPolicy: IfNotPresent

  identity:
    # booth-core's iframe-identity issuer (ADR 0069). It must equal core's
    # BOOTH_IFRAME_IDENTITY_ISSUER_URL EXACTLY — it is compared character-for-character with
    # the assertion's `iss`. Core's chart spells its default with ".svc.cluster.local:8080"
    # (not the shorter ".svc:8080" other booth URLs use); copying the wrong spelling refuses
    # every login. The default below matches core installed as release "booth-core" in
    # namespace "booth-system" (booth-notebooks uses the same default).
    issuerUrl: "http://booth-core.booth-system.svc.cluster.local:8080/iframe-identity"

  # The one Grafana role every admitted person gets. Editor, because Grafana's Explore (the
  # ad-hoc LogQL surface this view exists for) needs it. It can't manage data sources, users or
  # settings; the Loki data source is provisioned read-only. Admin is not allowed here.
  admittedRole: Editor

  # Grafana's own state (its user rows, any dashboards someone saves) lives on an emptyDir and
  # is lost when the pod restarts. Nothing is lost that matters for access: users are recreated
  # from the next signed assertion, and the data source is provisioned from this chart.
  resources: {}

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 472 # the grafana image's own user
    runAsGroup: 0
    fsGroup: 472
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

  # Defense in depth (ADR 0076): the signature check is the real boundary — a forged
  # X-Booth-Identity would need core's private key — but only booth-core's gateway has any
  # reason to reach Grafana, so the NetworkPolicy admits just its pods (plus the kubelet's
  # probes, which come from the node). Adjust if core's pods are labelled differently.
  allowedClients:
    - namespaceSelector: {}
      podSelector:
        matchLabels:
          app.kubernetes.io/name: booth-core

# Loki runs without authentication (it knows nothing about Booth identities). This policy
# lets only the collector and the viewer API reach it, so nothing else in the cluster can
# read every tenant's logs — or write forged ones — by going around the viewer. Needs a CNI
# that enforces NetworkPolicy (k3s's default does).
networkPolicy:
  enabled: true

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

resources: {}
