# The node-level collector's pipeline (ADR 0022), in Alloy's configuration language:
#
#   pods on this node ─► labels + log file path ─► tail files ─► parse CRI format ─► Loki
#
# Each line is labelled with namespace, pod, container, stream (stdout/stderr), module and,
# for a pod carrying booth.projectbooth.io/workspace, workspace (ADR 0077). Every label comes
# from Kubernetes metadata; nothing is parsed out of the line itself. (Loki derives severity at
# ingest, as structured metadata rather than a label: discover_log_levels in loki-config.yaml.)
#
# "module" is the first of these that the pod has, later rules overriding earlier ones:
#   1. the label booth.projectbooth.io/module (explicit; this chart sets it on its own pods)
#   2. the label app.kubernetes.io/name, minus a leading "booth-" ("booth-storage" → "storage",
#      matching the manifest id every sibling chart already uses)
#   3. the label app
#   4. the container name
# No contract makes modules set any of these; see docs/decisions/0005-module-label.md.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "booth-logging.collectorName" . }}
  labels:
    {{- include "booth-logging.labels" . | nindent 4 }}
    app.kubernetes.io/component: collector
data:
  config.alloy: |
    // Only pods scheduled on this collector's own node: every node runs one collector, and
    // each reads only its local /var/log/pods.
    discovery.kubernetes "pods" {
      role = "pod"
      selectors {
        role  = "pod"
        field = "spec.nodeName=" + sys.env("NODE_NAME")
      }
    }

    discovery.relabel "pods" {
      targets = discovery.kubernetes.pods.targets
      {{- with .Values.collector.excludeNamespaces }}

      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        regex         = {{ join "|" . | quote }}
        action        = "drop"
      }
      {{- end }}

      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }

      // module, least to most specific; "(.+)" so an absent label never blanks a value an
      // earlier rule set.
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "module"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app"]
        regex         = "(.+)"
        target_label  = "module"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
        regex         = "(?:booth-)?(.+)"
        target_label  = "module"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_label_booth_projectbooth_io_module"]
        regex         = "(.+)"
        target_label  = "module"
      }

      // workspace (ADR 0077): copied ONLY from the pod's booth.projectbooth.io/workspace
      // label — Kubernetes metadata, set by the platform process that created the pod (e.g.
      // booth-notebooks' spawner) from authenticated identity. It is decided here, per pod,
      // before any line is read; nothing in loki.process below extracts labels from line
      // content, so a pod can't label its own lines by what it prints. A value that isn't an
      // ADR 0025 workspace slug is dropped (no label), never passed through. The native
      // viewer pins every non-operator owner's query to this label.
      rule {
        source_labels = ["__meta_kubernetes_pod_label_booth_projectbooth_io_workspace"]
        regex         = "([a-z0-9-]+)"
        target_label  = "workspace"
      }

      // The kubelet writes each container's output to
      // /var/log/pods/<namespace>_<pod>_<uid>/<container>/<restart>.log
      rule {
        source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
        separator     = "/"
        target_label  = "__path__"
        replacement   = "/var/log/pods/*$1/*.log"
      }
    }

    local.file_match "pods" {
      path_targets = discovery.relabel.pods.output
    }

    loki.source.file "pods" {
      targets    = local.file_match.pods.targets
      forward_to = [loki.process.pods.receiver]
    }

    loki.process "pods" {
      // Deliberately no json/logfmt/regex/labels stages: every label on a line comes from
      // Kubernetes metadata above, never from what the pod wrote (ADR 0077).
      //
      // Unwraps the container runtime's line format (timestamp, stream, flags) and joins
      // lines the runtime split, so Loki stores exactly what the process wrote.
      stage.cri {}

      // The per-file label local.file_match adds carries nothing the pod/container labels
      // don't, and changes on every container restart.
      stage.label_drop {
        values = ["filename"]
      }

      forward_to = [loki.write.loki.receiver]
    }

    loki.write "loki" {
      endpoint {
        url = "{{ include "booth-logging.lokiURL" . }}/loki/api/v1/push"
      }
    }
