{{- if .Values.networkPolicy.enabled }}
# Loki has no authentication of its own, so reachability is its access control: only the
# collector (to push) and the viewer API (to query) may connect. Without this, any pod in
# the cluster could read every tenant's logs, or forge lines, by going around the viewer's
# owner check. (Kubelet probes come from the node and aren't affected on common CNIs.)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "booth-logging.lokiName" . }}
  labels:
    {{- include "booth-logging.labels" . | nindent 4 }}
    app.kubernetes.io/component: loki
spec:
  podSelector:
    matchLabels:
      {{- include "booth-logging.selectorLabels" (dict "ctx" . "component" "loki") | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "booth-logging.selectorLabels" (dict "ctx" . "component" "collector") | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "booth-logging.selectorLabels" (dict "ctx" . "component" "api") | nindent 14 }}
      ports:
        - port: 3100
          protocol: TCP
{{- end }}
