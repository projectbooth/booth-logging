# Loki's configuration. With default values, the rendered config.yaml is identical to
# hack/loki-local.yaml (what the Go tests run against); test/contract enforces that.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "booth-logging.lokiName" . }}
  labels:
    {{- include "booth-logging.labels" . | nindent 4 }}
    app.kubernetes.io/component: loki
data:
  config.yaml: |
    auth_enabled: false

    server:
      http_listen_port: 3100
      grpc_listen_port: 9095
      log_level: {{ .Values.loki.logLevel }}

    common:
      path_prefix: /loki
      replication_factor: 1
      # One instance and an in-memory ring: pinning the address avoids Loki guessing an
      # interface, which left it "not ready" forever in testing.
      instance_addr: 127.0.0.1
      ring:
        kvstore:
          store: inmemory
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules

    schema_config:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h

    # Retention is only enforced when the compactor is told to; without retention_enabled,
    # retention_period is silently ignored and logs are kept forever.
    compactor:
      working_directory: /loki/compactor
      retention_enabled: true
      delete_request_store: filesystem

    {{- $retention := printf "%sh" (include "booth-logging.retentionHours" .) }}
    limits_config:
      retention_period: {{ $retention }}
      max_query_lookback: {{ $retention }}
      allow_structured_metadata: true
      # Loki derives a detected_level for every line (JSON/logfmt level fields, or keywords
      # in plain text) — the viewer's severity filter. Modules need do nothing for it.
      discover_log_levels: true
      # Keep the label set to what the collector attaches; Loki would otherwise invent a
      # service_name label ("unknown_service" for most lines), which only confuses the viewer.
      discover_service_name: []
      reject_old_samples: true
      reject_old_samples_max_age: {{ $retention }}

    analytics:
      reporting_enabled: false
