{{- if include "booth-logging.grafanaActive" . }}
# The Grafana power-user view (ADR 0076). Config and admission rule: grafana-config.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "booth-logging.grafanaName" . }}
  labels:
    {{- include "booth-logging.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "booth-logging.selectorLabels" (dict "ctx" . "component" "grafana") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "booth-logging.labels" . | nindent 8 }}
        app.kubernetes.io/component: grafana
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/grafana-config.yaml") . | sha256sum | trunc 16 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.grafana.podSecurityContext | nindent 8 }}
      # Writes booth-core's iframe-identity keys for Grafana's jwk_set_file (see
      # internal/jwksfetch for why a file). Waits for core if it isn't up yet, and fails loudly
      # if core's discovery document names a different issuer than grafana.identity.issuerUrl.
      # Core only changes this key if its Secret is deleted; if that happens, restart this pod.
      initContainers:
        - name: fetch-jwks
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - fetch-jwks
            - -issuer={{ .Values.grafana.identity.issuerUrl | trimSuffix "/" }}
            - -out=/var/lib/booth-jwks/jwks.json
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: jwks
              mountPath: /var/lib/booth-jwks
      containers:
        - name: grafana
          image: "{{ .Values.grafana.image.repository }}:{{ .Values.grafana.image.tag }}"
          imagePullPolicy: {{ .Values.grafana.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.grafana.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
          volumeMounts:
            - name: config
              mountPath: /etc/grafana/grafana.ini
              subPath: grafana.ini
            - name: config
              mountPath: /etc/grafana/provisioning/datasources/datasources.yaml
              subPath: datasources.yaml
            - name: data
              mountPath: /var/lib/grafana
            - name: jwks
              mountPath: /var/lib/booth-jwks
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.grafana.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "booth-logging.grafanaName" . }}
        - name: data
          emptyDir: {}
        - name: jwks
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "booth-logging.grafanaName" . }}
  labels:
    {{- include "booth-logging.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
spec:
  selector:
    {{- include "booth-logging.selectorLabels" (dict "ctx" . "component" "grafana") | nindent 4 }}
  ports:
    - name: http
      port: 3000
      targetPort: http
---
# The second registration (ADR 0076, module-manifest.md's multi-surface pattern): its own id,
# nav entry and serviceRef, beside the native viewer's `logging`. booth-core's iframe proxy
# routes /iframe/logging-grafana/* here and signs X-Booth-Identity with aud=logging-grafana —
# the audience grafana-config.yaml requires.
apiVersion: booth.projectbooth.io/v1alpha1
kind: BoothModule
metadata:
  name: logging-grafana
  labels:
    {{- include "booth-logging.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
spec:
  id: logging-grafana
  displayName: Logs (Grafana)
  icon: logs
  version: {{ .Chart.AppVersion | quote }}
  contractVersion: "0.1.0"
  hasOwnUi: true
  uiIntegrationMode: iframe-proxy
  navGroup: manage
  navPath: /logging-grafana
  healthCheckPath: /api/health
  serviceRef:
    name: {{ include "booth-logging.grafanaName" . }}
    port: 3000
{{- end }}
