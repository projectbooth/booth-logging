apiVersion: v2
name: booth-logging
description: >
  Project Booth's logging module: a node-level collector (Grafana Alloy DaemonSet) tailing
  every pod's stdout/stderr into Grafana Loki, plus the native viewer's query API (ADR 0015,
  ADR 0022).
type: application
version: 0.1.0
appVersion: "0.1.0"
home: https://github.com/projectbooth/booth-logging

# ADR 0113 / contracts/module-manifest.md "Chart annotation: identity keys": tells
# booth-core's install API which of this chart's values.yaml paths carry the platform's
# shared identity settings, so a module installed through the install API (the Module
# Store's Install button included) is configured without hand-typed values. Core fills a
# mapped path only when the request doesn't already set it. iframeIssuerUrl is core's
# iframe-identity issuer, used only by the Grafana view: it is read only when grafana.enabled.
annotations:
  booth.projectbooth.io/identity-keys: |
    {"issuerUrl":"oidc.issuerUrl","clientId":"oidc.clientId","jwksUrl":"oidc.jwksUrl","workloadIssuerUrl":"oidc.workloadIssuerUrl","groupsClaim":"oidc.groupsClaim","iframeIssuerUrl":"grafana.identity.issuerUrl"}
