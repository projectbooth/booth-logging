# Loki config for local tests (hack/docker-compose.loki.yml). Mirrors what
# charts/booth-logging/templates/loki-configmap.yaml renders with default values — keep the
# two in step (test/contract checks the settings that matter are present in both).
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9095
  log_level: info

common:
  path_prefix: /loki
  replication_factor: 1
  instance_addr: 127.0.0.1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: "2024-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

limits_config:
  retention_period: 336h
  max_query_lookback: 336h
  allow_structured_metadata: true
  discover_log_levels: true
  # Keep the label set to what the collector attaches; Loki would otherwise invent a
  # service_name label ("unknown_service" for most lines), which only confuses the viewer.
  discover_service_name: []
  reject_old_samples: true
  reject_old_samples_max_age: 336h

analytics:
  reporting_enabled: false
