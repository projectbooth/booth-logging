name: CI

# Layers 1-2 (contracts/testing-strategy.md, ADR 0024): unit + contract tests, no cluster.
# The query path is tested against a real Loki container (hack/docker-compose.loki.yml, the
# same file used locally), not a mock of Loki's API. Runs on every push and PR; branch
# protection on main requires every job here to pass before merge.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: azure/setup-helm@v4 # test/contract renders the chart

      - name: Verify gofmt
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$fmt_out"
            exit 1
          fi

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - run: go vet ./...

      - run: go build ./...

      - name: Start Loki
        run: |
          docker compose -f hack/docker-compose.loki.yml up -d
          for i in $(seq 1 60); do
            [ "$(curl -s localhost:3100/ready)" = "ready" ] && exit 0
            sleep 2
          done
          echo "Loki never became ready"; exit 1

      - name: Unit + contract tests
        env:
          # A missing Loki, helm or docker (test/grafana runs a real Grafana) must fail the
          # build, never silently skip green.
          BOOTH_TEST_STRICT: "1"
        run: |
          eval "$(sh hack/test-env.sh)"
          go test -race -count=1 ./...

      - name: Loki logs on failure
        if: failure()
        run: docker compose -f hack/docker-compose.loki.yml logs --tail=100

  collector-config:
    # The collector's pipeline is Alloy configuration, not Go: check the rendered config
    # parses with the exact Alloy version the chart deploys.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: alloy fmt on the rendered config
        run: |
          set -euo pipefail
          tag=$(helm show values charts/booth-logging | awk '/^collector:/{c=1} c && /tag:/{gsub(/"/,"",$2); print $2; exit}')
          for extra in "" "--set collector.excludeNamespaces={kube-system,noisy}"; do
            helm template t charts/booth-logging --set oidc.issuerUrl=https://idp.example --set oidc.clientId=x $extra \
              --show-only templates/collector-config.yaml \
              | sed -n '/config.alloy: |/,$p' | tail -n +2 | sed 's/^    //' > config.alloy
            docker run --rm -v "$PWD/config.alloy:/config.alloy:ro" "grafana/alloy:$tag" fmt /config.alloy > /dev/null
          done

  web-test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build

  helm-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: helm lint
        run: |
          helm lint charts/booth-logging \
            --set oidc.issuerUrl=https://keycloak.example.com/realms/booth \
            --set oidc.clientId=booth-logging
      - name: helm lint (7-day retention, no persistence, no NetworkPolicy)
        run: |
          helm lint charts/booth-logging \
            --set oidc.issuerUrl=https://keycloak.example.com/realms/booth \
            --set oidc.clientId=booth-logging \
            --set loki.retentionDays=7 \
            --set loki.persistence.enabled=false \
            --set networkPolicy.enabled=false
      - name: helm lint (Grafana view disabled)
        run: |
          helm lint charts/booth-logging \
            --set oidc.issuerUrl=https://keycloak.example.com/realms/booth \
            --set oidc.clientId=booth-logging \
            --set grafana.enabled=false

  image-build:
    # Catches a broken Dockerfile on the PR that breaks it, not at release time. Not pushed.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
